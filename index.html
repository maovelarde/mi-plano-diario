<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071A2E">
<link rel="manifest" href="./manifest.webmanifest">
<title>Mi Plano Diario 2.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap');
:root{--bg:#071a2e;--panel:#0e3152;--panel2:#123b61;--line:rgba(145,215,235,.15);--text:#eef7fc;--muted:#91abc1;--cyan:#35d6d1;--cyan2:#70e6e2;--gold:#f5ba45;--goldsoft:rgba(245,186,69,.15);--green:#69d59c;--danger:#e77a69}
*{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;background:#061426;color:var(--text)}body{font-family:'Work Sans',sans-serif}.app{max-width:600px;margin:auto;min-height:100vh;background:linear-gradient(#071a2e,#09233d);padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
button,input{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{display:flex;gap:10px;align-items:center}.logo{width:43px;height:43px;border-radius:14px;background:#061a2e;border:1px solid var(--line);display:grid;place-items:center}.logo svg{width:34px}.title{font:700 19px 'Space Grotesk'}.subtitle{font:500 10px 'JetBrains Mono';color:var(--cyan);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}.round{width:40px;height:40px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:13px}
.hero{background:linear-gradient(145deg,#123b61,#0c2947);border:1px solid var(--line);border-radius:21px;padding:17px;box-shadow:0 16px 40px #0002}.heroRow{display:flex;align-items:center;gap:14px}.level{width:76px;height:76px;flex:0 0 76px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(145deg,var(--gold),#d9992e);color:#182c43;display:flex;flex-direction:column;align-items:center;justify-content:center}.level small{font:600 8px 'JetBrains Mono'}.level b{font:700 29px 'Space Grotesk';line-height:1}.grow{flex:1}.bar{height:9px;background:#ffffff18;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--cyan));border-radius:20px;transition:width .35s}.xp{font:10.5px 'JetBrains Mono';color:var(--muted);margin-top:7px}.streak{text-align:center;min-width:48px}.streak .fire{font-size:22px}.streak b{display:block;font:700 23px 'Space Grotesk'}.streak small{font:10px 'JetBrains Mono';color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.metric{background:#ffffff06;border:1px solid var(--line);border-radius:13px;padding:10px;text-align:center}.metric b{display:block;font:700 18px 'Space Grotesk'}.metric span{font-size:10px;color:var(--muted)}
.section{margin-top:20px}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:0 2px 9px}.sectionTitle{font:700 16px 'Space Grotesk'}.sectionSub{font:10px 'JetBrains Mono';color:var(--muted);text-transform:uppercase;margin-top:3px}.link{background:none;border:0;color:var(--cyan);font-size:11px}.task{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:7px}.check{width:23px;height:23px;flex:0 0 23px;border:1.5px solid var(--cyan);border-radius:7px;display:grid;place-items:center;cursor:pointer}.check.done{background:var(--cyan);color:#062338}.check.done:after{content:"✓";font-weight:800}.taskText{flex:1;font-size:13px;cursor:pointer}.taskText.done{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--gold)}.badge{font:10px 'JetBrains Mono';color:var(--gold);background:var(--goldsoft);padding:5px 7px;border-radius:999px;white-space:nowrap}.add{display:flex;gap:7px;margin-top:8px}.add input{flex:1;background:#ffffff06;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px}.add button{width:44px;border:0;border-radius:12px;background:var(--gold);color:#182c43;font-size:22px;font-weight:700}.info{margin-top:10px;padding:13px 14px;border:1px solid #35d6d144;background:#35d6d10b;border-radius:13px;color:var(--muted);font-size:11.5px;line-height:1.55}.info b{color:var(--cyan)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:9px}.cardTitle{font:700 14px 'Space Grotesk';margin-bottom:10px}.muted{color:var(--muted);font-size:11.5px;line-height:1.5}.reward{display:flex;align-items:center;gap:11px}.rewardIcon{width:45px;height:45px;border-radius:14px;background:var(--goldsoft);display:grid;place-items:center;font-size:22px}.rewardBody{flex:1}.rewardName{font-weight:600;font-size:13px}.rewardCost{font:10px 'JetBrains Mono';color:var(--gold);margin-top:3px}.claim{border:1px solid var(--gold);background:var(--goldsoft);color:var(--gold);border-radius:10px;padding:8px 10px;font-size:10px;font-weight:700}.claim:disabled{opacity:.35}.empty{text-align:center;color:var(--muted);padding:25px 10px}
.chart{height:135px;display:flex;align-items:end;gap:8px;padding:10px 2px}.col{flex:1;text-align:center}.colBar{background:linear-gradient(var(--cyan),#158f95);border-radius:7px 7px 3px 3px;min-height:4px}.colLabel{font:9px 'JetBrains Mono';color:var(--muted);margin-top:5px}
.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#061527f5;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 7px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:var(--muted);font-size:9px;padding:4px}.nav button b{display:block;font-size:18px;margin-bottom:2px}.nav button.active{color:var(--cyan)}.toast{position:fixed;z-index:20;left:50%;bottom:80px;transform:translateX(-50%);background:#0b2946;border:1px solid var(--cyan);border-radius:999px;padding:9px 13px;font-size:11px;box-shadow:0 10px 30px #0005;white-space:nowrap}
@media(max-width:380px){.app{padding-left:12px;padding-right:12px}.task{gap:7px}.taskText{font-size:12px}.badge{font-size:9px}}

<style>
.modalBack{position:fixed;inset:0;background:#020b16c9;backdrop-filter:blur(8px);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal{width:min(600px,100%);max-height:92vh;overflow:auto;background:#09233d;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px #0007}
.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalTitle{font:700 19px 'Space Grotesk'}.close{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;width:36px;height:36px}
.pinGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:14px auto}.pinKey{height:48px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;font-size:18px}.pinDots{text-align:center;font-size:22px;letter-spacing:8px;color:var(--cyan);min-height:28px}
.adminTabs{display:flex;gap:6px;overflow:auto;margin-bottom:13px}.adminTab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 11px;font-size:11px}.adminTab.active{background:var(--cyan);color:#062338;border-color:var(--cyan);font-weight:700}
.adminRow{display:flex;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.adminIcon{width:39px;height:39px;border-radius:11px;background:var(--goldsoft);display:grid;place-items:center}.adminBody{flex:1}.adminName{font-size:12.5px;font-weight:600}.adminMeta{font:9.5px 'JetBrains Mono';color:var(--muted);margin-top:3px}.adminBtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:7px 8px;font-size:10px}.adminBtn.danger{color:var(--danger);border-color:#e77a6944}
.form{display:grid;gap:9px}.form input{width:100%;background:#ffffff08;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px}.form button{border:0;background:var(--gold);color:#182c43;border-radius:10px;padding:10px;font-weight:700}.notice{padding:10px 12px;border-radius:10px;background:#35d6d10b;border:1px solid #35d6d133;color:var(--muted);font-size:11px;line-height:1.45}.history{font-size:11px;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:25px 10px}
</style>

</style>
</head>
<body><div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useEffect,useState}=React;
const KEY="mi-plano-diario-v2"; const LEVEL_XP=150, DAILY_BONUS=15;
const D=[["Tender la cama",5,"🛏️"],["Revisar agenda y tareas del colegio",10,"📚"],["Hacer tareas o estudiar",25,"✏️"],["Leer un rato (aunque no sea tarea)",15,"📖"],["Organizar ropa y útiles para el día siguiente",10,"👕"],["Recoger su espacio y llevar la ropa sucia a su lugar",10,"🧺"],["Actividad física (mínimo 60 minutos)",20,"🏃"],["Un momento en familia sin pantalla",10,"👨‍👩‍👦"]];
const W=[["Barrer o aspirar su espacio",15],["Trapear",15],["Doblar y guardar ropa limpia",10],["Ayudar con los platos o la cocina",10],["Ayudar con las compras o guardar el mercado",10],["Limpiar su habitación a fondo",20]];
const R=[["Elegir la película familiar","🎬",100,true],["30 min extra de videojuego","🎮",150,true],["Elegir la cena","🍕",200,true],["Plan especial con la familia","⭐",300,false]];
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
function fresh(){return{date:today(),daily:D.map(x=>({id:uid(),label:x[0],xp:x[1],icon:x[2]})),weekly:W.map(x=>({id:uid(),label:x[0],xp:x[1]})),checks:{},xp:0,streak:0,lastBonus:null,rewards:R.map(x=>({id:uid(),name:x[0],icon:x[1],cost:x[2],repeatable:x[3]})),history:[],parentPin:null}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch{return fresh()}}
function App(){
const[s,setS]=useState(load),[tab,setTab]=useState("hoy"),[toast,setToast]=useState(""),[admin,setAdmin]=useState(false),[pin,setPin]=useState(""),[adminTab,setAdminTab]=useState("rewards"),[nr,setNr]=useState({name:"",icon:"🎁",cost:100,repeatable:true});
useEffect(()=>localStorage.setItem(KEY,JSON.stringify(s)),[s]); const notify=x=>{setToast(x);setTimeout(()=>setToast(""),1600)};
const level=Math.floor(s.xp/LEVEL_XP)+1,into=s.xp%LEVEL_XP,pct=Math.round(into/LEVEL_XP*100),done=s.daily.filter(x=>s.checks[x.id]).length;
function toggle(id){if(s.checks[id])return;const x=s.daily.find(i=>i.id===id),checks={...s.checks,[id]:true};let xp=s.xp+x.xp,streak=s.streak,last=s.lastBonus;if(s.daily.every(i=>checks[i.id])&&last!==s.date){xp+=DAILY_BONUS;streak++;last=s.date;notify("🔥 Rutina completa · +"+DAILY_BONUS+" XP")}else notify("+"+x.xp+" XP");setS({...s,checks,xp,streak,lastBonus:last})}
function add(){const e=document.getElementById("newTask");if(!e?.value.trim())return;setS({...s,daily:[...s.daily,{id:uid(),label:e.value.trim(),xp:10,icon:"✓"}]});e.value="";notify("Actividad agregada")}
function claim(r){const used=s.history.filter(h=>h.rewardId===r.id).length;if(s.xp<r.cost||(!r.repeatable&&used))return;setS({...s,xp:s.xp-r.cost,history:[...s.history,{rewardId:r.id,name:r.name,cost:r.cost,date:new Date().toLocaleString("es-CO")}]});notify("🎁 "+r.name)}
function unlock(){if(!s.parentPin){if(pin.length===4){setS({...s,parentPin:pin});setPin("");setAdmin("open");notify("🔐 PIN creado")}return}if(pin===s.parentPin){setPin("");setAdmin("open")}else{setPin("");notify("PIN incorrecto")}}
function saveReward(){if(!nr.name.trim()||Number(nr.cost)<=0)return;setS({...s,rewards:[...s.rewards,{id:uid(),name:nr.name.trim(),icon:nr.icon||"🎁",cost:Number(nr.cost),repeatable:nr.repeatable}]});setNr({name:"",icon:"🎁",cost:100,repeatable:true});notify("🎁 Recompensa creada")}
function delReward(id){setS({...s,rewards:s.rewards.filter(r=>r.id!==id)});notify("Recompensa eliminada")}
return <div className="app">
<header className="top"><div className="brand"><div className="logo"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="33" fill="none" stroke="#35d6d1" strokeWidth="8"/><path d="M30 51l13 13 28-31" fill="none" stroke="#35d6d1" strokeWidth="9" strokeLinecap="round" strokeLinejoin="round"/><path d="M74 18l7 3 7 3-7 3-3 7-3-7-7-3 7-3 3-7z" fill="#f5ba45"/></svg></div><div><div className="title">Mi Plano Diario</div><div className="subtitle">Tu rutina. Tu progreso.</div></div></div><button className="round" onClick={()=>{setPin("");setAdmin(true)}}>⚙</button></header>
<section className="hero"><div className="heroRow"><div className="level"><small>NIVEL</small><b>{level}</b></div><div className="grow"><div className="bar"><div className="fill" style={{width:pct+"%"}}/></div><div className="xp">{into} / {LEVEL_XP} XP · {LEVEL_XP-into} para nivel {level+1}</div></div><div className="streak"><div className="fire">🔥</div><b>{s.streak}</b><small>racha</small></div></div><div className="metrics"><div className="metric"><b>{s.xp}</b><span>XP disponible</span></div><div className="metric"><b>{done}/{s.daily.length}</b><span>hoy</span></div><div className="metric"><b>{s.history.length}</b><span>canjes</span></div></div></section>
{tab==="hoy"&&<><div className="section"><div className="sectionHead"><div><div className="sectionTitle">Hoy</div><div className="sectionSub">{new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"})}</div></div></div>{s.daily.map(x=><div className="task" key={x.id}><div className={"check "+(s.checks[x.id]?"done":"")} onClick={()=>toggle(x.id)}></div><div className={"taskText "+(s.checks[x.id]?"done":"")} onClick={()=>toggle(x.id)}>{x.icon} {x.label}</div><div className="badge">+{x.xp} XP</div></div>)}<div className="add"><input id="newTask" placeholder="Agregar actividad..."/><button onClick={add}>+</button></div><div className="info"><b>El descanso también cuenta.</b><br/>El sueño y el tiempo libre no se puntúan.</div></div></>}
{tab==="semana"&&<div className="section"><div className="sectionHead"><div><div className="sectionTitle">Esta semana</div><div className="sectionSub">Constancia, no perfección</div></div></div>{s.weekly.map(x=><div className="task" key={x.id}><div className="check"></div><div className="taskText">{x.label}</div><div className="badge">+{x.xp} XP</div></div>)}</div>}
{tab==="recompensas"&&<div className="section"><div className="sectionHead"><div><div className="sectionTitle">🎁 Recompensas</div><div className="sectionSub">Canjea tu esfuerzo</div></div></div><div className="card"><div className="cardTitle">Tu saldo</div><div style={{font:"700 30px 'Space Grotesk'",color:"var(--gold)"}}>{s.xp} XP</div></div>{s.rewards.map(r=>{const used=s.history.filter(h=>h.rewardId===r.id).length,locked=!r.repeatable&&used>0;return <div className="card reward" key={r.id}><div className="rewardIcon">{r.icon}</div><div className="rewardBody"><div className="rewardName">{r.name}</div><div className="rewardCost">{r.cost} XP · {r.repeatable?"repetible":"una vez"}</div></div><button className="claim" disabled={s.xp<r.cost||locked} onClick={()=>claim(r)}>{locked?"Canjeada":"Canjear"}</button></div>})}</div>}
{tab==="stats"&&<div className="section"><div className="sectionHead"><div><div className="sectionTitle">📊 Progreso</div><div className="sectionSub">Tu evolución</div></div></div><div className="card"><div className="cardTitle">Actividad semanal</div><div className="muted">Las estadísticas reales vendrán en el siguiente bloque.</div></div></div>}
<nav className="nav">{[["hoy","⌂","Hoy"],["semana","▦","Semana"],["recompensas","🎁","Premios"],["stats","▥","Progreso"]].map(([k,i,l])=><button key={k} className={tab===k?"active":""} onClick={()=>setTab(k)}><b>{i}</b>{l}</button>)}</nav>
{admin===true&&<div className="modalBack"><div className="modal"><div className="modalHead"><div className="modalTitle">⚙️ Control Parental</div><button className="close" onClick={()=>setAdmin(false)}>×</button></div><div className="notice">{s.parentPin?"Introduce tu PIN de 4 dígitos.":"Crea un PIN de 4 dígitos para proteger esta sección."}</div><div className="pinDots">{pin.replace(/./g,"•")}</div><div className="pinGrid">{["1","2","3","4","5","6","7","8","9","⌫","0","✓"].map(k=><button className="pinKey" onClick={()=>k==="⌫"?setPin(pin.slice(0,-1)):k==="✓"?unlock():pin.length<4&&setPin(pin+k)}>{k}</button>)}</div></div></div>}
{admin==="open"&&<div className="modalBack"><div className="modal"><div className="modalHead"><div className="modalTitle">⚙️ Control Parental</div><button className="close" onClick={()=>setAdmin(false)}>×</button></div><div className="adminTabs">{[["rewards","🎁 Recompensas"],["history","📜 Historial"],["security","🔐 Seguridad"]].map(([k,l])=><button className={"adminTab "+(adminTab===k?"active":"")} onClick={()=>setAdminTab(k)}>{l}</button>)}</div>
{adminTab==="rewards"&&<><div className="card"><div className="cardTitle">Crear recompensa</div><div className="form"><input placeholder="Nombre" value={nr.name} onChange={e=>setNr({...nr,name:e.target.value})}/><input placeholder="Emoji" value={nr.icon} onChange={e=>setNr({...nr,icon:e.target.value})}/><input type="number" min="1" placeholder="Costo en XP" value={nr.cost} onChange={e=>setNr({...nr,cost:e.target.value})}/><label style={{fontSize:"11px",color:"var(--muted)"}}><input type="checkbox" checked={nr.repeatable} onChange={e=>setNr({...nr,repeatable:e.target.checked})}/> Repetible</label><button onClick={saveReward}>＋ Crear recompensa</button></div></div>{s.rewards.map(r=><div className="adminRow" key={r.id}><div className="adminIcon">{r.icon}</div><div className="adminBody"><div className="adminName">{r.name}</div><div className="adminMeta">{r.cost} XP · {r.repeatable?"repetible":"una vez"}</div></div><button className="adminBtn danger" onClick={()=>delReward(r.id)}>Eliminar</button></div>)}</>}
{adminTab==="history"&&(s.history.length?s.history.slice().reverse().map(h=><div className="history">🎁 {h.name} · {h.cost} XP<br/>{h.date}</div>):<div className="empty">Todavía no hay canjes.</div>)}
{adminTab==="security"&&<div className="card"><div className="cardTitle">Seguridad</div><div className="muted">El PIN protege las reglas y recompensas en este dispositivo.</div></div>}
</div></div>}
{toast&&<div className="toast">{toast}</div>}</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
