<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102A43"><link rel="manifest" href="manifest.webmanifest">
<title>Mi Organizador Diario NKV</title>
<style>
:root{--bg:#102a43;--p:#173b5e;--p2:#102d49;--l:#315879;--i:#edf6ff;--m:#9db6ce;--t:#63d5df;--g:#f2bd52;--ok:#7bd39a;--d:#e47a62}
*{box-sizing:border-box}body{margin:0;background:#0b2034;color:var(--i);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding:20px 16px 90px;background:var(--bg)}
button,input{font:inherit}button{cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:24px;font-weight:800}.sub{font-size:11px;color:var(--t);letter-spacing:.1em;text-transform:uppercase}.gear{border:1px solid var(--l);background:var(--p);color:var(--i);width:40px;height:40px;border-radius:12px;font-size:20px}
.hero{background:linear-gradient(145deg,#174a70,#173653);border:1px solid var(--l);border-radius:18px;padding:16px;margin-bottom:14px}.heroRow{display:flex;align-items:center;gap:14px}.badge{width:72px;height:72px;flex:0 0 72px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(145deg,var(--t),#35aab9);color:#09253c;display:flex;flex-direction:column;align-items:center;justify-content:center}.badge small{font-size:8px;font-weight:800}.badge b{font-size:27px}.grow{flex:1}.xpLine{display:flex;justify-content:space-between;font-size:12px;color:var(--m)}.bar{height:9px;background:#0c253d;border-radius:8px;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,var(--t),var(--g))}.streak{text-align:center}.streak b{display:block;font-size:23px}.muted{color:var(--m);font-size:12px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}.stat{background:#102d49;border:1px solid #274c6d;border-radius:11px;padding:9px 5px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:var(--m)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0}.nav button{border:0;background:transparent;color:var(--m);padding:9px 2px;border-bottom:2px solid transparent;font-size:10px}.nav button.active{color:var(--i);border-bottom-color:var(--g)}
.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:15px;margin-bottom:12px}.title{font-weight:800;color:var(--t);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}.row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px dashed var(--l)}.check{width:21px;height:21px;border:1.5px solid var(--t);border-radius:6px;flex:0 0 21px}.done{background:var(--g);border-color:var(--g)}.done:after{content:"✓";color:#17304b;font-weight:900;display:block;text-align:center}.label{flex:1;font-size:13px}.doneText{text-decoration:line-through;text-decoration-color:var(--g);color:var(--m)}.xp,.cost{font-size:10px;color:var(--g);background:#3b341f;padding:4px 7px;border-radius:99px;white-space:nowrap}.del{border:0;background:none;color:var(--d);font-size:16px}.add{display:flex;gap:7px;margin-top:11px}.add input{flex:1;background:#102d49;border:1px solid var(--l);border-radius:9px;padding:9px;color:var(--i)}.add button,.primary{border:0;background:var(--t);color:#08263c;border-radius:9px;padding:9px 13px;font-weight:800}.reward{display:flex;align-items:center;gap:10px}.rewardIcon{font-size:24px}.rewardInfo{flex:1}.small{border:1px solid var(--l);background:transparent;color:var(--i);border-radius:8px;padding:7px 9px;font-size:11px}.danger{color:var(--d);border-color:var(--d)}.modalBack{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:10}.modal{width:min(620px,100%);background:#173b5e;border:1px solid var(--l);border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}.pin{display:flex;gap:7px}.pin input{width:44px;text-align:center;background:#102d49;border:1px solid var(--l);color:var(--i);padding:10px;border-radius:9px}.footer{text-align:center;color:var(--m);font-size:10px;margin-top:18px}

.smart{background:linear-gradient(145deg,#1a486d,#163653);border:1px solid #3a6484;border-radius:16px;padding:15px;margin-bottom:12px}
.smartTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.smartTitle{font-size:16px;font-weight:800}.smartSub{font-size:11px;color:var(--m);margin-top:3px}
.progressRing{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--t) var(--pct),#0c253d 0);position:relative;flex:0 0 58px}
.progressRing:after{content:"";position:absolute;inset:6px;background:#173b5e;border-radius:50%}.progressRing span{position:relative;z-index:1;font-size:11px;font-weight:800}
.nextBox{margin-top:12px;background:#102d49;border:1px solid #315879;border-radius:12px;padding:11px}.nextLabel{font-size:9px;color:var(--t);text-transform:uppercase;letter-spacing:.08em}.nextText{font-size:13px;font-weight:700;margin-top:3px}.nextXp{font-size:10px;color:var(--g);margin-top:3px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.quickItem{background:#102d49;border:1px solid #315879;border-radius:10px;padding:9px}.quickItem b{display:block;font-size:12px}.quickItem span{font-size:9px;color:var(--m)}
<style>.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.adminCard{background:#102d49;border:1px solid #315879;border-radius:12px;color:inherit;padding:12px;text-align:left}.adminCard b{display:block;margin-top:5px}.adminCard span{display:block;color:var(--m);font-size:10px;margin-top:3px}</style></style></head><body><div id="root"></div><script>
const KEY="mi-organizador-diario-nkv-2-2",D=[["🛏️ Tender la cama",5],["📚 Revisar agenda y tareas del colegio",10],["✏️ Hacer tareas o estudiar",25],["📖 Leer un rato (aunque no sea tarea)",15],["👕 Organizar ropa y útiles para el día siguiente",10],["🧹 Recoger su espacio y llevar la ropa sucia a su lugar",10],["🏃 Actividad física (mínimo 60 minutos)",20],["👨‍👩‍👦 Un momento en familia sin pantalla",10],["🐕 Sacar a Copito",10]],W=[["🧹 Barrer o aspirar su espacio",15],["🧽 Trapear",15],["👕 Doblar y guardar ropa limpia",10],["🍽️ Ayudar con los platos o la cocina",10],["🛒 Ayudar con las compras o guardar el mercado",10],["🧼 Limpiar su habitación a fondo",20]],A=[["🧺 Aprender a lavar su propia ropa",30],["🍳 Cocinar una comida sencilla por sí mismo",30],["💰 Manejar su propio dinero (mesada o ahorro)",25],["🚌 Usar transporte público de forma segura",25],["🔧 Hacer una tarea pequeña de mantenimiento",20],["🙋 Pedir ayuda cuando algo no se entiende, en vez de rendirse",15]];
const id=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10),make=a=>a.map(x=>({id:id(),label:x[0],xp:x[1]}));
function fresh(){return{xp:0,streak:0,date:today(),daily:make(D),weekly:make(W),ach:make(A),dc:{},wc:{},ac:{},rewards:[{id:id(),name:"Helado",cost:50,repeat:true,icon:"🍦"},{id:id(),name:"Elegir película familiar",cost:80,repeat:true,icon:"🎬"},{id:id(),name:"Plan especial",cost:150,repeat:false,icon:"⭐"}],redeemed:[],pin:""}}
let s=JSON.parse(localStorage.getItem(KEY)||"null")||fresh(),tab="hoy",modal="";
const save=()=>{localStorage.setItem(KEY,JSON.stringify(s));render()},esc=x=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
if(s.date!==today()){s.date=today();s.dc={};}
if(!s.daily.length && !s._dailyRestored221){s.daily=make(D);s._dailyRestored221=true;localStorage.setItem(KEY,JSON.stringify(s));}
function count(a,c){return a.filter(x=>c[x.id]).length}function lv(){return Math.floor(s.xp/150)+1}function dxp(){return s.daily.filter(x=>s.dc[x.id]).reduce((n,x)=>n+x.xp,0)}
function taskCard(title,a,c,k){return `<div class="card"><div class="title">${title}</div>${a.map(x=>`<div class="row"><div class="check ${c[x.id]?"done":""}" onclick="toggle('${k}','${x.id}')"></div><div class="label ${c[x.id]?"doneText":""}" onclick="toggle('${k}','${x.id}')">${x.icon||""} ${esc(x.label)}</div><div class="xp">+${x.xp} XP</div></div>`).join("")}</div>`}
function achCard(){return `<div class="card"><div class="title">Logros y habilidades (${count(s.ach,s.ac)}/${s.ach.length})</div>${s.ach.map(x=>`<div class="row"><div class="check ${s.ac[x.id]?"done":""}" onclick="toggle('ac','${x.id}')"></div><div class="label ${s.ac[x.id]?"doneText":""}" onclick="toggle('ac','${x.id}')">${esc(x.label)}</div><div class="xp">+${x.xp} XP</div></div>`).join("")}<div class="card" style="margin:12px 0 0;background:#102d49"><div class="title">🎁 Recompensas</div>${s.rewards.map(reward).join("")}</div></div>`}
function reward(r){return `<div class="row reward"><div class="rewardIcon">${r.icon}</div><div class="rewardInfo"><b>${esc(r.name)}</b><div class="cost">${r.cost} XP · ${r.repeat?"repetible":"una vez"}</div></div><button class="small" ${s.xp<r.cost?"disabled":""} onclick="redeem('${r.id}')">Canjear</button></div>`}
function stats(){return `<div class="card"><div class="title">Resumen de progreso</div><div class="stats"><div class="stat"><b>${s.xp}</b><span>XP total</span></div><div class="stat"><b>${count(s.daily,s.dc)}/${s.daily.length}</b><span>Hoy</span></div><div class="stat"><b>${count(s.weekly,s.wc)}/${s.weekly.length}</b><span>Semana</span></div><div class="stat"><b>${count(s.ach,s.ac)}</b><span>Logros</span></div></div><p class="muted">Datos calculados desde tu progreso guardado en este dispositivo.</p></div><div class="card"><div class="title">🎁 Historial de canjes</div>${s.redeemed.length?s.redeemed.slice().reverse().map(x=>`<div class="row"><div>${x.icon}</div><div class="label">${esc(x.name)}</div><div class="cost">-${x.cost} XP</div></div>`).join(""):'<div class="muted">Todavía no hay canjes.</div>'}</div>`}
function settings(){return `<div class="card"><div class="title">⚙ Control Parental</div><p class="muted">Administra rutinas, XP y recompensas desde aquí.</p><button class="primary" onclick="openSettings()">Abrir configuración</button></div>`}
function openSettings(){
 if(s.pin){openPinGate();return}
 openProtectedSettings(true);
}
function openPinGate(){
 modal=`<div class="modalBack" onclick="if(event.target===this){modal='';render()}"><div class="modal">
 <div class="title">🔐 Control Parental</div>
 <p class="muted">Introduce el PIN de 4 dígitos para acceder a la configuración.</p>
 <div class="pin">${[0,1,2,3].map(i=>`<input id="g${i}" maxlength="1" inputmode="numeric" oninput="if(this.value&&this.nextElementSibling)this.nextElementSibling.focus()">`).join("")}</div>
 <div class="add"><button class="primary" onclick="verifyPin()">Desbloquear</button><button class="small" onclick="modal='';render()">Cancelar</button></div>
 </div></div>`;render()
}
function verifyPin(){
 const p=[0,1,2,3].map(i=>document.getElementById("g"+i).value).join("");
 if(p!==s.pin){alert("PIN incorrecto");return}
 openProtectedSettings(false);
}
function openProtectedSettings(first){
 modal=`<div class="modalBack" onclick="if(event.target===this){modal='';render()}"><div class="modal">
 <div class="title">🔐 Control Parental</div>
 <p class="muted">${first?"Crea un PIN para proteger la administración de la app.":"Acceso de administrador autorizado."}</p>
 <div class="adminGrid">
  <button class="adminCard" onclick="adminTasks('daily')">📅<b>Actividades diarias</b><span>Editar, agregar o eliminar</span></button>
  <button class="adminCard" onclick="adminTasks('weekly')">🗓️<b>Actividades semanales</b><span>Editar, agregar o eliminar</span></button>
  <button class="adminCard" onclick="adminRewards()">🎁<b>Recompensas</b><span>Gestionar premios y XP</span></button>
  <button class="adminCard" onclick="adminXP()">⚡<b>XP y progreso</b><span>Corregir o reiniciar</span></button>
 </div>
 <div class="add"><button class="primary" onclick="changePin()">🔑 Cambiar PIN</button><button class="small" onclick="modal='';render()">Cerrar</button></div>
 </div></div>`;render()
}
function adminTasks(kind){
 const arr=kind==="daily"?s.daily:s.weekly;
 modal=`<div class="modalBack" onclick="if(event.target===this){openProtectedSettings(false)}"><div class="modal">
 <div class="title">${kind==="daily"?"📅 Actividades diarias":"🗓️ Actividades semanales"}</div>
 <p class="muted">Solo el administrador puede modificar estas actividades.</p>
 ${arr.map((x,i)=>`<div class="row"><div class="label"><b>${x.icon||"📌"} ${esc(x.label)}</b><br><span class="cost">+${x.xp} XP</span></div><button class="small" onclick="editTask('${kind}',${i})">Editar</button><button class="small danger" onclick="adminDeleteTask('${kind}',${i})">×</button></div>`).join("")}
 <div class="add"><input id="newTask" placeholder="Nueva actividad"><input id="newXp" type="number" min="1" placeholder="XP"><button onclick="adminAddTask('${kind}')">＋</button></div>
 <div class="add"><button class="small" onclick="openProtectedSettings(false)">← Volver</button></div>
 </div></div>`;render()
}
function adminAddTask(kind){
 const label=document.getElementById("newTask").value.trim(), xp=Number(document.getElementById("newXp").value)||10;
 if(!label)return;
 const item={id:"admin_"+Date.now(),label,xp,icon:"📌"};
 if(kind==="daily")s.daily.push(item);else s.weekly.push(item);
 save();adminTasks(kind);
}
function adminDeleteTask(kind,i){
 if(!confirm("¿Eliminar esta actividad?"))return;
 const arr=kind==="daily"?s.daily:s.weekly;
 arr.splice(i,1);save();adminTasks(kind);
}
function editTask(kind,i){
 const arr=kind==="daily"?s.daily:s.weekly, x=arr[i];
 const label=prompt("Nombre de la actividad",x.label); if(label===null)return;
 const xp=Number(prompt("XP",x.xp)); if(!label.trim()||!xp)return;
 x.label=label.trim();x.xp=xp;save();adminTasks(kind);
}
function adminRewards(){
 modal=`<div class="modalBack" onclick="if(event.target===this){openProtectedSettings(false)}"><div class="modal">
 <div class="title">🎁 Recompensas</div><p class="muted">Solo el administrador puede modificar premios y costos.</p>
 ${s.rewards.map(r=>`<div class="row"><div class="rewardIcon">${r.icon||"🎁"}</div><div class="label"><b>${esc(r.name)}</b><br><span class="cost">${r.cost} XP</span></div><button class="small" onclick="editReward('${r.id}')">Editar</button><button class="small danger" onclick="delReward('${r.id}')">×</button></div>`).join("")}
 <div class="add"><input id="rn" placeholder="Nueva recompensa"><input id="rc" type="number" min="1" placeholder="XP"><button onclick="addReward()">＋</button></div>
 <div class="add"><button class="small" onclick="openProtectedSettings(false)">← Volver</button></div>
 </div></div>`;render()
}
function adminXP(){
 modal=`<div class="modalBack" onclick="if(event.target===this){openProtectedSettings(false)}"><div class="modal">
 <div class="title">⚡ XP y progreso</div><p class="muted">Herramientas administrativas para corregir o reiniciar progreso.</p>
 <div class="add"><input id="xpAdjust" type="number" placeholder="XP a sumar/restar"><button class="primary" onclick="adjustXP()">Aplicar</button></div>
 <div class="add"><button class="small danger" onclick="resetProgress()">Reiniciar progreso</button><button class="small" onclick="openProtectedSettings(false)">← Volver</button></div>
 </div></div>`;render()
}
function adjustXP(){
 const n=Number(document.getElementById("xpAdjust").value)||0;
 s.xp=Math.max(0,s.xp+n);save();modal="";render();
}
function resetProgress(){
 if(!confirm("¿Seguro que quieres reiniciar el progreso? Esta acción no se puede deshacer."))return;
 s.xp=0;s.streak=0;s.ac={};s.dc={};s.wc={};save();modal="";render();
}
function changePin(){
 const p=prompt("Nuevo PIN de 4 dígitos");
 if(!/^\d{4}$/.test(p||"")){alert("Usa exactamente 4 números");return}
 s.pin=p;save();alert("PIN actualizado");openProtectedSettings(false);
}
function savePin(){
 const p=[0,1,2,3].map(i=>document.getElementById("p"+i).value).join("");
 if(!/^\d{4}$/.test(p)){alert("Usa exactamente 4 números");return}
 s.pin=p;save();modal="";render();
}
function addReward(){let n=document.getElementById("rn").value.trim(),c=+document.getElementById("rc").value;if(!n||!c)return;s.rewards.push({id:id(),name:n,cost:c,repeat:true,icon:"🎁"});save();openSettings()}
function editReward(i){let r=s.rewards.find(x=>x.id===i),n=prompt("Nombre",r.name),c=+prompt("Costo en XP",r.cost);if(n&&c){r.name=n;r.cost=c;save();openSettings()}}
function delReward(i){if(confirm("¿Eliminar esta recompensa?")){s.rewards=s.rewards.filter(x=>x.id!==i);save();openSettings()}}
function redeem(i){let r=s.rewards.find(x=>x.id===i);if(!r||s.xp<r.cost)return;s.xp-=r.cost;s.redeemed.push({name:r.name,cost:r.cost,icon:r.icon,date:today()});save()}
function toggle(k,i){let c=k==="dc"?s.dc:k==="wc"?s.wc:s.ac,a=k==="dc"?s.daily:k==="wc"?s.weekly:s.ach,x=a.find(v=>v.id===i);c[i]=!c[i];s.xp+=c[i]?x.xp:-x.xp;save()}
function addItem(k){let v=document.getElementById("newItem").value.trim();if(!v)return;(k==="dc"?s.daily:s.weekly).push({id:id(),label:v,xp:10});save()}
function removeItem(k,i){if(k==="dc")s.daily=s.daily.filter(x=>x.id!==i);else s.weekly=s.weekly.filter(x=>x.id!==i);save()}
function smartDashboard(){
 const done=count(s.daily,s.dc), total=s.daily.length, pct=total?Math.round(done/total*100):0;
 const remaining=s.daily.filter(x=>!s.dc[x.id]);
 const next=remaining[0];
 const toNext=150-(s.xp%150);
 const affordable=s.rewards.filter(r=>s.xp>=r.cost);
 const nearest=s.rewards.filter(r=>r.cost>s.xp).sort((a,b)=>a.cost-b.cost)[0];
 const weekDone=count(s.weekly,s.wc);
 return `<div class="smart">
   <div class="smartTop">
     <div><div class="smartTitle">Tu día, en una mirada 👋</div><div class="smartSub">${done===total&&total?"¡Rutina completa!":"Vamos paso a paso. Cada tarea cuenta."}</div></div>
     <div class="progressRing" style="--pct:${pct}%"><span>${pct}%</span></div>
   </div>
   <div class="nextBox">
     <div class="nextLabel">${next?"Siguiente objetivo":"Objetivo cumplido"}</div>
     <div class="nextText">${next?esc(next.label):"Has completado todas las actividades de hoy 🎉"}</div>
     <div class="nextXp">${next?"+"+next.xp+" XP al completarla": "Buen trabajo. Disfruta también tu tiempo libre."}</div>
   </div>
   <div class="quick">
     <div class="quickItem"><b>${s.xp} XP</b><span>Total acumulado · ${toNext} para el siguiente nivel</span></div>
     <div class="quickItem"><b>${weekDone}/${s.weekly.length}</b><span>Tareas semanales</span></div>
     <div class="quickItem"><b>${affordable.length}</b><span>Recompensas disponibles</span></div>
     <div class="quickItem"><b>${nearest?nearest.cost-s.xp:0} XP</b><span>${nearest?"para "+esc(nearest.name):"¡Puedes elegir una recompensa!"}</span></div>
   </div>
 </div>`;
}

function render(){
 let into=s.xp%150;
 let body=tab==="hoy"?taskCard("Actividades de hoy",s.daily,s.dc,"dc"):
          tab==="semana"?taskCard("Tareas de esta semana",s.weekly,s.wc,"wc"):
          tab==="logros"?achCard():tab==="stats"?stats():settings();
 document.getElementById("root").innerHTML=`<div class="app">
 <div class="top"><div><div class="brand">Mi Organizador Diario NKV</div><div class="sub">Tu rutina · tu progreso</div></div><button class="gear" onclick="openSettings()">⚙️</button></div>
 <div class="hero"><div class="heroRow"><div class="badge"><small>NIVEL</small><b>${lv()}</b></div><div class="grow"><div class="xpLine"><span>${into} / 150 XP</span><span>faltan ${150-into} XP</span></div><div class="bar"><div class="fill" style="width:${Math.round(into/150*100)}%"></div></div><div class="muted">Cada día cuenta.</div></div><div class="streak">🔥<b>${s.streak}</b><span class="muted">racha</span></div></div><div class="stats"><div class="stat"><b>${dxp()}</b><span>XP hoy</span></div><div class="stat"><b>${s.daily.length}</b><span>Tareas hoy</span></div><div class="stat"><b>${count(s.ach,s.ac)}</b><span>Logros</span></div><div class="stat"><b>🎁</b><span>Premios</span></div></div></div>
 ${tab==="hoy"?smartDashboard():""}
 <div class="nav">${[["hoy","⌂ Hoy"],["semana","▦ Semana"],["logros","🏆 Logros"],["stats","▥ Estadísticas"],["ajustes","⚙ Ajustes"]].map(x=>`<button class="${tab===x[0]?"active":""}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join("")}</div>
 ${body}<div class="footer">Mi Organizador Diario NKV · datos guardados en este dispositivo</div>${modal}</div>`
}
render();
</script></body></html>
